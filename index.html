<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>人脸表情录制系统 / Facial Expression Recorder</title>
<style>
  :root {
    color-scheme: light;
    /* ---- 未来感 · 浅色靛蓝配色 ---- */
    --bg: #eef0ff;                       /* 淡薰衣草底色 */
    --surface: #ffffff;                  /* 面板 */
    --surface-2: #fbfbff;                /* 输入框 */
    --line: rgba(91,95,166,.18);         /* 靛蓝细线描边 */
    --line-strong: rgba(91,95,166,.34);
    --text: #2b2f4a;                     /* 深靛墨字 */
    --muted: #5d6388;                    /* 次级文字 */
    --faint: #8a8fb4;
    --accent: #7d8cff;                   /* 电光紫（描边/光晕） */
    --accent-deep: #5b5fa6;              /* 沉稳靛蓝（文字点缀） */
    --accent-bright: #5b5fa6;
    --accent-ink: #ffffff;               /* 按钮文字 */
    --good: #0ca88f;                     /* 深青 */
    --warn: #b3861f;
    --bad: #d4506c;
    --rec: #e04c64;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(125,140,255,.18), transparent 60%),
      radial-gradient(900px 500px at 85% 110%, rgba(12,168,143,.08), transparent 60%),
      radial-gradient(700px 500px at 8% 50%, rgba(91,95,166,.10), transparent 65%),
      var(--bg);
    color: var(--text);
    font-family: "SF Pro Display", "Segoe UI", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-x: hidden;
  }
  ::selection { background: rgba(125,140,255,.30); }
  #app { min-height: 100%; display: flex; flex-direction: column; }
  .screen { flex: 1; display: none; flex-direction: column; align-items: center;
            padding: 24px; position: relative; }
  .screen.active { display: flex; }
  .center-box { margin: auto; width: 100%; max-width: 520px; }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: .3px; text-align: center; margin: 0 0 24px; }
  h2 { font-size: 26px; font-weight: 600; letter-spacing: .2px; text-align: center; margin: 6px 0; }
  .sub { font-size: 17px; color: var(--muted); text-align: center; margin: 0 0 10px; }
  label.field { display: flex; align-items: center; gap: 12px; margin: 12px 0; font-size: 17px; }
  label.field > span { width: 150px; }
  input, select, button, textarea { font-size: 16px; font-family: inherit; }
  input[type=text], input[type=number], select {
    flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong);
    background: var(--surface-2); color: var(--text); transition: border-color .15s;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(125,140,255,.18);
  }
  button.primary {
    padding: 10px 26px; border-radius: 8px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #7d8cff, #5b5fa6); color: var(--accent-ink);
    font-size: 16px; font-weight: 600; letter-spacing: .2px;
    box-shadow: 0 2px 14px rgba(125,140,255,.35), inset 0 1px 0 rgba(255,255,255,.18);
    transition: filter .15s, transform .1s, box-shadow .15s;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 2px 20px rgba(125,140,255,.5), inset 0 1px 0 rgba(255,255,255,.18); }
  button.primary:active:not(:disabled) { transform: translateY(1px); }
  button.primary:disabled { background: #dcdff0; color: #9aa0c5; cursor: not-allowed; box-shadow: none; }
  button.secondary {
    padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line-strong); cursor: pointer;
    background: transparent; color: var(--text); font-size: 16px; margin: 0 6px;
    transition: border-color .15s, background .15s;
  }
  button.secondary:hover { border-color: var(--accent); background: rgba(125,140,255,.10); }
  .lang-btns { position: absolute; top: 16px; right: 18px; display: flex; }
  .lang-btns button { padding: 7px 16px; border: 1px solid var(--line-strong); background: transparent;
                      color: var(--muted); cursor: pointer; font-size: 14px; transition: color .15s; }
  .lang-btns button:first-child { border-radius: 8px 0 0 8px; }
  .lang-btns button:last-child { border-radius: 0 8px 8px 0; border-left: none; }
  .lang-btns button.active { background: rgba(125,140,255,.16); color: var(--accent-bright); border-color: var(--accent); }
  .lang-btns button.active + button { border-left: none; }
  .lang-btns.inline { position: static; justify-content: center; margin-top: 16px; }
  .instr-text {
    width: 100%; max-width: 900px; height: 55vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line);
    padding: 20px; border-radius: 12px; white-space: pre-wrap;
    font-size: 16px; line-height: 1.55;
  }
  /* ---- PIS 结构化排版 ---- */
  .pis-doc { white-space: normal; font-size: 15px; line-height: 1.65; }
  .pis-doc p { margin: 0 0 10px; }
  .pis-doc h3 { font-size: 16.5px; font-weight: 600; color: var(--accent-deep); letter-spacing: .2px;
                margin: 24px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
  .pis-doc h3:first-child { margin-top: 0; }
  .pis-doc ul, .pis-doc ol { margin: 0 0 10px; padding-left: 24px; }
  .pis-doc li { margin: 4px 0; }
  .pis-doc h3.instr-important::before { content: "★ "; color: var(--warn); }
  .pis-doc .instr-note { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .pis-doc hr { border: none; border-top: 1px dashed var(--line-strong); margin: 22px 0; }
  .pis-meta { margin: 0 0 14px; }
  .pis-meta > div { margin: 3px 0; }
  .pis-meta b, .pis-doc .pis-label { color: var(--accent-deep); font-weight: 600; }
  .pis-meta-sub { color: var(--muted); font-size: 13px; }
  .pis-todo { color: #c92a2a; background: rgba(201,42,42,.08); border-radius: 4px; padding: 0 3px; font-weight: 600; }
  .pis-version { color: var(--faint); font-size: 13px; text-align: center; margin-top: 6px; }
  .check-row { display: flex; align-items: center; gap: 10px; margin: 16px 0; font-size: 16px; }
  .video-holder {
    width: 100%; max-width: 1000px; margin: 10px auto; background: #000;
    position: relative; display: flex; align-items: center; justify-content: center;
    border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 8px 28px rgba(43,47,74,.20);
  }
  .video-stage { position: relative; line-height: 0; }
  .video-stage canvas, .video-stage video { display: block; max-width: 100%; max-height: 60vh; }
  #overlay, #recOverlay, #testOverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  video.hidden-src { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .status { font-size: 18px; font-weight: bold; margin: 8px 0; min-height: 24px; }
  .emotion { font-size: 36px; font-weight: bold; margin: 6px 0 2px; text-align: center; }
  .desc { font-size: 18px; color: var(--accent-bright); max-width: 900px; text-align: center; margin: 0 0 4px; }
  .hint { font-size: 16px; color: var(--muted); margin: 4px 0; text-align: center; }
  .btn-row { margin: 10px 0; display: flex; flex-wrap: wrap; justify-content: center; }
  .progress { font-size: 16px; color: var(--faint); margin: 8px 0; }
  .big-note { font-size: 17px; color: var(--text); text-align: center; max-width: 700px; }
  a { color: var(--accent-bright); }

  /* ---- 知情同意（Consent / PIS） ---- */
  .consent-body { width: 100%; max-width: 900px; text-align: left; }
  .consent-section-title { font-size: 20px; font-weight: 600; margin: 4px 0; }
  .consent-section-intro { font-size: 14px; color: var(--muted); margin: 4px 0 10px; line-height: 1.5; }
  .consent-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
                  padding: 14px 16px; margin: 10px 0; }
  .consent-item .q { font-size: 15px; line-height: 1.55; }
  .consent-item .qnum { color: var(--accent-bright); font-weight: 600; margin-right: 6px; }
  .consent-tick { display: flex; align-items: flex-start; gap: 10px; }
  .consent-tick input { margin-top: 4px; flex: none; }
  /* 一键全选（仅用于 A 节与 H 节的必选勾选项） */
  .tick-all { display: flex; align-items: center; gap: 10px; margin: 8px 0 12px; cursor: pointer;
              font-size: 14.5px; font-weight: 600; color: var(--accent-deep);
              background: rgba(125,140,255,.10); border: 1px dashed rgba(91,95,166,.45);
              border-radius: 10px; padding: 10px 14px; transition: background .15s; }
  .tick-all:hover { background: rgba(125,140,255,.18); }
  .tick-all input { flex: none; }

  /* ---- 手机/平板专用（粗指针 + 无悬停）：电脑端（含窄窗口）完全不命中 ---- */
  .rotate-hint { display: none; font-size: 14px; color: var(--warn); text-align: center; margin: 0 0 8px; }
  @media (pointer: coarse) and (hover: none) {
    .screen { padding: 16px 12px; }
    h1 { font-size: 24px; margin-bottom: 16px; }
    h2 { font-size: 21px; }
    .emotion { font-size: 28px; }
    .desc, .big-note { font-size: 16px; }
    .lang-btns { position: static; justify-content: center; margin: 0 0 10px; }
    label.field { flex-direction: column; align-items: stretch; gap: 6px; }
    label.field > span { width: auto; }
    .instr-text { height: 58vh; padding: 14px; }
    .consent-item { padding: 12px; }
    .consent-yn { gap: 16px; }
    .video-stage canvas, .video-stage video { max-height: 46vh; }
    button.primary, button.secondary { padding: 14px 20px; font-size: 17px; }  /* 加大触点面积 */
    .btn-row { gap: 8px; }
    button.tap-rec { width: 100%; max-width: 420px; padding: 18px 24px; font-size: 20px; border-radius: 12px; }
    button.tap-rec.stop { background: linear-gradient(135deg, #ef6a7e, #c9364f); }
  }
  @media (pointer: coarse) and (hover: none) and (orientation: portrait) {
    .rotate-hint { display: block; }
  }
  .consent-yn { display: flex; gap: 22px; margin-top: 10px; }
  .consent-yn label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 15px; }
  .consent-info { background: rgba(125,140,255,.10); border: 1px solid rgba(91,95,166,.35); border-radius: 10px;
                  padding: 12px 14px; margin: 12px 0; font-size: 13.5px; color: #454b7e; line-height: 1.55; }
  .consent-required { color: var(--bad); font-size: 13px; margin-top: 4px; min-height: 16px; }
  .consent-readonly { background: var(--surface); border: 1px solid var(--line);
                      border-left: 3px solid var(--accent); color: #3a3f63; }
  .consent-step { font-size: 15px; color: var(--faint); margin: 4px 0 12px; text-align: center; }
  .sig-canvas { background: #fff; border: 1px solid var(--line-strong); border-radius: 6px; touch-action: none; display: block;
                width: 100%; max-width: 480px; height: 160px; cursor: crosshair; }
  .field-inline { display: flex; align-items: center; gap: 12px; margin: 10px 0; font-size: 15px; flex-wrap: wrap; }
  .field-inline input[type=text] { flex: 1; min-width: 220px; }
  textarea.consent-free { width: 100%; min-height: 70px; border-radius: 8px; border: 1px solid var(--line-strong);
                          background: var(--surface-2); color: var(--text); padding: 8px 10px; resize: vertical; }

  /* ---- 同意完成过渡页：视觉重点放在“开始数据收集”按钮，避免被误认为已结束 ---- */
  .cd-badge { display: inline-block; font-size: 14px; font-weight: 600; color: var(--good);
              background: rgba(12,168,143,.10); border: 1px solid rgba(12,168,143,.35);
              border-radius: 999px; padding: 5px 14px; margin-bottom: 20px; }
  button.primary.cta {
    font-size: 21px; font-weight: 700; padding: 18px 46px; border-radius: 12px;
    box-shadow: 0 6px 26px rgba(125,140,255,.45), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .cd-warn { font-size: 15px; color: var(--warn); margin: 22px 0 0; }
</style>
</head>
<body>
<div id="app">
  <!-- 2b. 同意完成 -> 开始数据收集（过渡页） -->
  <section class="screen" id="screen-consent-done">
    <div class="center-box" style="max-width:680px;text-align:center">
      <div class="cd-badge" id="cdTitle"></div>
      <p class="big-note" id="cdMsg" style="margin:0 auto 22px"></p>
      <button class="primary cta" id="btnConsentDone"></button>
      <p class="cd-warn" id="cdWarn"></p>
    </div>
  </section>

  <!-- 3. 注册（个人信息，在同意之后；第二部分 · 数据收集） -->
  <section class="screen" id="screen-login">
    <div class="lang-btns">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <div class="consent-step" id="loginPartLabel"></div>
    <div class="center-box">
      <h1 id="loginTitle"></h1>
      <label class="field"><span id="lblName"></span><input type="text" id="fName" /></label>
      <label class="field"><span id="lblAge"></span><input type="number" id="fAge" min="0" /></label>
      <label class="field"><span id="lblGender"></span>
        <select id="fGender"><option>Male</option><option>Female</option><option>Other</option></select></label>
      <label class="field"><span id="lblNat"></span><input type="text" id="fNat" /></label>
      <div style="text-align:center;margin-top:22px"><button class="primary" id="btnSubmit"></button></div>
    </div>
  </section>

  <!-- 0. 欢迎页（入口，说明两部分） -->
  <section class="screen active" id="screen-welcome">
    <div class="center-box" style="max-width:820px">
      <h1 id="welcomeTitle" style="white-space:nowrap"></h1>
      <p class="big-note" id="welcomeIntro" style="margin:0 auto 18px"></p>
      <div class="consent-info consent-readonly" id="welcomePart1"></div>
      <div class="consent-info consent-readonly" id="welcomePart2"></div>
      <div class="consent-info" id="resumeBox" style="display:none">
        <div id="resumeText"></div>
        <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="primary" id="btnResume"></button>
          <button class="secondary" id="btnDiscard"></button>
        </div>
      </div>
      <div style="text-align:center;margin-top:22px"><button class="primary" id="btnWelcomeStart"></button></div>
      <div class="lang-btns inline">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>
  </section>

  <!-- 1. 参与者须知 PIS（第一部分 · 同意） -->
  <section class="screen" id="screen-pis">
    <div class="consent-step" id="pisPartLabel"></div>
    <h1 id="pisTitle">Participant Information Sheet</h1>
    <div class="instr-text" id="pisText"></div>
    <div class="check-row">
      <input type="checkbox" id="pisChk" />
      <label for="pisChk" id="pisChkLbl">I have read and understood the Participant Information Sheet above.</label>
    </div>
    <div class="btn-row">
      <button class="secondary" id="btnPisBack">‹ Back</button>
      <button class="primary" id="btnPisNext">Continue to consent ›</button>
    </div>
  </section>

  <!-- 1c. 知情同意书 -->
  <section class="screen" id="screen-consent">
    <div class="consent-step" id="consentPartLabel"></div>
    <h1 id="consentTitle">Consent Form for Facial Expression Video Data Collection</h1>
    <div class="consent-step" id="consentStep"></div>
    <div class="consent-body" id="consentBody"></div>
    <div class="consent-required" id="consentError" style="text-align:center;max-width:900px"></div>
    <div class="btn-row">
      <button class="secondary" id="btnConsentBack">‹ Back</button>
      <button class="primary" id="btnConsentNext">Next ›</button>
    </div>
  </section>

  <!-- 2. 须知 -->
  <section class="screen" id="screen-instr">
    <div class="consent-step" id="instrPartLabel"></div>
    <h1 id="instrHeader"></h1>
    <div class="instr-text" id="instrText"></div>
    <div class="check-row">
      <input type="checkbox" id="readChk" />
      <label for="readChk" id="readChkLbl"></label>
    </div>
    <button class="primary" id="btnRead"></button>
  </section>

  <!-- 3. 摄像头测试 -->
  <section class="screen" id="screen-camtest">
    <div class="consent-step" id="camPartLabel"></div>
    <h2 id="camHeader"></h2>
    <p class="sub" id="camSub"></p>
    <div class="field-inline" id="camSelRow" style="justify-content:center;display:none">
      <span id="camSelLbl"></span><select id="camSelect" style="max-width:340px"></select>
    </div>
    <div class="video-holder"><div class="video-stage" id="stageTest">
      <canvas id="testCanvas"></canvas><canvas id="testOverlay"></canvas>
    </div></div>
    <div class="rotate-hint" data-rotate></div>
    <div class="status" id="testStatus" style="color:var(--warn)"></div>
    <button class="primary" id="btnStartRec" disabled></button>
  </section>

  <!-- 4. 录制 -->
  <section class="screen" id="screen-record">
    <div class="consent-step" id="recPartLabel"></div>
    <div class="progress" id="progressLbl"></div>
    <div class="emotion" id="emotionLbl"></div>
    <div class="desc" id="descLbl"></div>
    <div class="video-holder"><div class="video-stage" id="stageRec">
      <canvas id="recCanvas"></canvas>
      <video id="reviewVideo" class="hidden-src" playsinline muted loop></video>
      <canvas id="recOverlay"></canvas>
    </div></div>
    <div class="rotate-hint" data-rotate></div>
    <div class="status" id="bigStatus" style="color:var(--rec)"></div>
    <div class="hint" id="hintLbl"></div>
    <div class="hint" id="uploadInfo" style="color:var(--good)"></div>
    <div class="btn-row" id="btnRow"></div>
  </section>

  <!-- 5. 感谢 / 结束 -->
  <section class="screen" id="screen-finish">
    <div class="center-box" style="text-align:center;max-width:640px">
      <div style="font-size:56px;margin-bottom:6px">🎉</div>
      <h1 id="finishTitle" style="color:var(--good)"></h1>
      <p class="big-note" id="finishSaved" style="margin:0 auto 14px"></p>
      <p id="closeNote" style="display:none;font-weight:600;color:var(--good);font-size:21px;
         background:rgba(12,168,143,.08);border:1px solid rgba(12,168,143,.35);border-radius:10px;padding:14px 18px;margin:8px auto 16px"></p>
      <button class="primary" id="btnDownload"></button>
    </div>
  </section>
</div>

<!-- 隐藏的相机源视频（提供逐帧回调用于时间戳与镜像绘制） -->
<video id="camSrc" class="hidden-src" playsinline muted></video>

<!-- 本地私密配置（含上传地址）；被 .gitignore 忽略。缺失也不影响页面，仅不自动上传。 -->
<script src="config.js"></script>
<script type="module">
// 注意：人脸检测库（第三方）改为「进入摄像头页时才动态加载」，
// 使登录 / PIS / 同意书等页面零第三方请求（符合伦理附录对同意/录制页的建议）。
// 人脸检测库与模型随页面本地部署：参与者运行时不向 jsDelivr / Google Storage 发起任何请求
const MEDIAPIPE_BASE = "./lib/mediapipe";

/* --------------------------------------------------------------------- *
 *  配置（与 record.py 对齐）
 * --------------------------------------------------------------------- */
const EMOTIONS = [
  "anger","disgust","fear","happiness","sadness","surprise","wink",
  "eye_movement","tongue_out","head_movement","asymmetric_surprise",
  "asymmetric_smile","asymmetric_eyebrow_raise","laughter",
];

const EMOTION_HINT = {
  zh: {
    anger:"Anger 愤怒", disgust:"Disgust 厌恶", fear:"Fear 恐惧",
    happiness:"Happiness 高兴", sadness:"Sadness 悲伤", surprise:"Surprise 惊讶",
    wink:"Wink 眨单眼 (Single-eye blink)", eye_movement:"Eye Movement 眼球转动",
    tongue_out:"Tongue Out 吐舌", head_movement:"Head Movement 转头",
    asymmetric_surprise:"Asymmetric Surprise 不对称惊讶",
    asymmetric_smile:"Asymmetric Smile 不对称微笑",
    asymmetric_eyebrow_raise:"Asymmetric Eyebrow Raise 单侧扬眉",
    laughter:"Laughter 大笑",
  },
  en: {
    anger:"Anger", disgust:"Disgust", fear:"Fear", happiness:"Happiness",
    sadness:"Sadness", surprise:"Surprise", wink:"Wink (single-eye blink)",
    eye_movement:"Eye Movement", tongue_out:"Tongue Out", head_movement:"Head Movement",
    asymmetric_surprise:"Asymmetric Surprise", asymmetric_smile:"Asymmetric Smile",
    asymmetric_eyebrow_raise:"Asymmetric Eyebrow Raise", laughter:"Laughter",
  },
};

const EMOTION_DESC = {
  zh: {
    anger:"请做出生气/愤怒的表情。", disgust:"请做出嫌恶/厌恶的表情。",
    fear:"请做出害怕/恐惧的表情。", happiness:"请做出高兴的表情。",
    sadness:"请做出伤心/悲伤的表情。", surprise:"请做出吃惊/惊讶的表情。",
    wink:"只眨/闭合一只眼睛，另一只眼睛保持睁开（头部不动）。",
    eye_movement:"保持头部不动，仅转动眼球（可选择看左、右、上、下）。",
    tongue_out:"自然地把舌头伸出来。",
    head_movement:"缓慢地转动头部（如向左右摇头或上下点头）。",
    asymmetric_surprise:"请做出惊讶的表情，但同时保证你的表情是不对称的",
    asymmetric_smile:"邪魅一笑",
    asymmetric_eyebrow_raise:"只扬起一侧眉毛，另一侧保持不动。",

/* ---- 录制码率（手机与电脑一致） ----------------------------------------
   浏览器对 MediaRecorder 的默认视频码率与分辨率基本无关（Chromium 约 2.5 Mbps），
   在 1080p 以上会明显压坏皮肤纹理与眨眼/微表情等低对比细节，因此这里显式指定。
   目标码率 = 宽 × 高 × 帧率 × BPP（bits per pixel）。
   BPP 参考：流媒体 ~0.07；高质量存档 ~0.15；0.25 属视觉近无损档（本项目取值）。
   注意：码率直接决定文件大小，1080p30 ≈ 15 Mbps ≈ 1.9 MB/s，4K30 ≈ 62 Mbps ≈ 7.8 MB/s。
   若上传带宽或存储成本吃紧，只需调小 VIDEO_BPP 或 VIDEO_BITRATE_MAX 这两个常量。 */
const VIDEO_BPP = 0.25;
const VIDEO_BITRATE_MIN = 8e6;     // 低分辨率下的下限
const VIDEO_BITRATE_MAX = 120e6;   // 上限：超出后编码器多半也无法维持
const AUDIO_BITRATE = 192e3;       // 语音/环境音在 192 kbps 已属透明

// 依据实际录制分辨率与帧率计算目标码率（浏览器/硬件编码器可能再往下钳制）
function targetVideoBitrate(w, h, fps) {
  const bps = w * h * fps * VIDEO_BPP;
  return Math.round(Math.min(Math.max(bps, VIDEO_BITRATE_MIN), VIDEO_BITRATE_MAX));
}

`Participant Information Sheet

Study title: Facial Expression Video Data Collection for Human Behaviour Understanding, Modelling and Generation

Principal Investigator: Jingyi Wan, Department of Computing, Imperial College London
Research group: Intelligent Behavior Understanding Group, Department of Computing, Imperial College London
Contact: j.wan@imperial.ac.uk
Co-investigators / collaborators: None

You are being invited to take part in a research study. Before you decide it is important for you to understand why the research is being done and what it will involve. Please take time to read the following information carefully and discuss it with others if you wish. Ask us if there is anything that is not clear or if you would like more information. Take time to decide whether or not you wish to take part. Thank you for reading this.

Do I have to take part?
It is up to you to decide whether or not to take part. If you do decide to take part you will be given this information sheet to keep and be asked to sign a consent form. If you decide to take part you are still free to withdraw at any time and without giving a reason. If you withdraw, we will stop collecting new information from you; recordings and information we have already collected, any analyses already carried out, and any data or outputs already shared or published with your permission, may be kept (see "What are your choices about how your information is used?" below).

What is the purpose of the study?
This study collects short video recordings of people performing a set of prompted facial expressions and movements (for example anger, happiness, surprise, eye movement, head movement). We use these recordings, and numerical features derived from them, to develop, train, validate, evaluate and compare computational and artificial-intelligence models for human behaviour understanding, facial-expression modelling, and facial-video generation, reconstruction, animation and editing. This study is being conducted as a student research project as part of the researcher's postgraduate studies in the Department of Computing, Imperial College London.

Why have I been invited?
You have been invited because you are aged 18 years or over and are able to perform a short set of facial expressions in front of a webcam. We expect approximately 50 participants to take part.

What will happen to me if I take part?
- Taking part involves a single session lasting about 10-15 minutes; there is only one session and no follow-up visits.
- You will read this information sheet and complete an electronic consent form. You will then be guided, through your web browser, to record a series of short clips (each a few seconds long) in which you perform prompted facial expressions and movements - about 14 items in total.

What do I have to do?
There are no lifestyle or dietary restrictions. You only need reasonable lighting and to follow the on-screen prompts. You may pause or stop at any time, and you may close the window to end the session; data already saved is not affected.

What are the possible disadvantages and risks of taking part?
The risks are minimal. You may feel mild fatigue or self-consciousness while performing expressions. Because we record video of your face, you may be recognisable in the original recordings even though your name is removed. We reduce privacy risks by using a participant code instead of your name, storing data securely with access controls, and only including identifiable images or video in public outputs if you separately agree to this on the consent form.

What are the possible benefits of taking part?
We cannot promise the study will help you, but the information we get might help advance research into human behaviour understanding and facial-video technologies.

What if something goes wrong?

function formatPisDoc(el, text) {
  const escT = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const mark = (s) => escT(s).replace(/\[TODO[^\]]*\]|TODO[:：][^\]\n]*\]?/g,

  const out = [];
  let list = null, meta = null, para = [];
  const closePara = () => { if (para.length) { out.push(`<p>${para.join(" ")}</p>`); para = []; } };
  const closeList = () => { if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; } };
  const closeMeta = () => { if (meta) { out.push(`<div class="pis-meta">${meta.join("")}</div>`); meta = null; } };
  const closeAll = () => { closePara(); closeList(); closeMeta(); };
  let first = true;
  for (const raw of text.split("\n")) {
    const l = raw.trim();
    if (!l) { closeAll(); continue; }
    if (first) { first = false;
      // 页面本身已有 "Participant Information Sheet" 大标题，跳过正文中重复的首行
      if (/^(participant information sheet|参与者须知)$/i.test(l)) continue; }
    if (/^-{5,}$/.test(l)) { closeAll(); out.push("<hr>"); continue; }          // 分隔线
    if (/^-\s+/.test(l)) {                                                       // 要点列表
      closePara(); closeMeta();
      if (!list) list = [];
      list.push(`<li>${mark(l.replace(/^-\s+/, ""))}</li>`); continue;
    }
    closeList();
    if (/version\s|版本/i.test(l) && /participant information sheet|参与者须知/i.test(l)) {
      closeAll(); out.push(`<p class="pis-version">${mark(l)}</p>`); continue;   // 版本页脚
    }
    const noColon = !/[:：]/.test(l);
    if ((l.length <= 80 && /[?？]/.test(l) && !/[.。]$/.test(l)) ||               // 问句标题
        (l.length <= 40 && noColon && !/[.。;；,，)）\]"”]$/.test(l) && !/^[（(]/.test(l))) { // 短标题
      closeAll(); out.push(`<h3>${mark(l)}</h3>`); continue;
    }
    if (meta && /^[（(]/.test(l)) { meta.push(`<div class="pis-meta-sub">${mark(l)}</div>`); continue; }
    const ci = l.search(/[:：]/);
    if (ci > 0 && ci < 50 && !/[\[。]|\.\s/.test(l.slice(0, ci))) {
      const val = l.slice(ci + 1).trim();
      if (l.length < 160 && !/。|\.\s|\.$/.test(val)) {                           // 元信息行（标签: 值，值不含整句）
        closePara();
        if (!meta) meta = [];
        meta.push(`<div><b>${mark(l.slice(0, ci + 1))}</b> ${mark(val)}</div>`); continue;
      }
      closeMeta(); closePara();                                                  // 带标签的段落（正文含整句）
      out.push(`<p><span class="pis-label">${mark(l.slice(0, ci + 1))}</span> ${mark(val)}</p>`); continue;
    }
    closeMeta();
    para.push(mark(l));
  }
  closeAll();
  el.classList.add("pis-doc");
  el.innerHTML = out.join("");
}

/* 将纯文本实验须知渲染为带层级的 HTML：【…】/[…] -> 小节标题，数字行 -> 有序列表，
 * "- " -> 圆点列表，"——/--" 附注并入上一条，★…★ -> 高亮重要标题。原文字符串不变。 */
function formatInstrDoc(el, text) {
  const escT = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const out = [];
  let ol = null, ul = null, para = [];
  const closePara = () => { if (para.length) { out.push(`<p>${para.join(" ")}</p>`); para = []; } };
  const closeOl = () => { if (ol) { out.push(`<ol>${ol.join("")}</ol>`); ol = null; } };
  const closeUl = () => { if (ul) { out.push(`<ul>${ul.join("")}</ul>`); ul = null; } };
  const closeLists = () => { closePara(); closeOl(); closeUl(); };
  const appendToLast = (arr, html) => { arr[arr.length - 1] = arr[arr.length - 1].replace(/<\/li>$/, html + "</li>"); };
  let first = true, m;
  for (const raw of text.split("\n")) {
    const l = raw.trim();
    if (!l) { closeLists(); continue; }
    if (first) { first = false;
      // 页面已有 "Instructions / 实验须知" 大标题，跳过正文中重复的首行
      if (/^(instructions|实验须知)$/i.test(l)) continue; }
    if (/^★/.test(l)) { closeLists();
      out.push(`<h3 class="instr-important">${escT(l.replace(/[★\[\]【】]/g, "").trim())}</h3>`); continue; }
    if (/^[\[【].+[\]】]$/.test(l)) { closeLists();
      out.push(`<h3>${escT(l.replace(/^[\[【]|[\]】]$/g, ""))}</h3>`); continue; }
    if ((m = l.match(/^(\d+)[.、]\s*(.*)$/))) { closePara(); closeUl(); if (!ol) ol = []; ol.push(`<li>${escT(m[2])}</li>`); continue; }
    if (/^-\s+/.test(l)) { closePara(); closeOl(); if (!ul) ul = []; ul.push(`<li>${escT(l.replace(/^-\s+/, ""))}</li>`); continue; }
    if (/^(--|——)/.test(l) && ol) { appendToLast(ol, `<div class="instr-note">${escT(l)}</div>`); continue; }
    if (ol) { appendToLast(ol, " " + escT(l)); continue; }       // 数字项换行续文
    if (ul) { appendToLast(ul, " " + escT(l)); continue; }       // 圆点项换行续文
    para.push(escT(l));                                           // 连续行合并为同一段落
  }
  closeLists();
  el.classList.add("pis-doc"); // 复用 PIS 排版样式
  el.innerHTML = out.join("");
}

function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }
function infoBox(text, cls) { return `<div class="consent-info ${cls||""}">${esc(text)}</div>`; }

function ynItem(id, text, stored) {
  const y = stored === "yes" ? "checked" : "", n = stored === "no" ? "checked" : "";
  return `<div class="consent-item"><div class="q"><span class="qnum">${id}.</span>${esc(text)}</div>

    </div></div>`;
}
function tickItem(idx, text, checked, num) {
  return `<div class="consent-item"><label class="consent-tick">
    <input type="checkbox" data-tick="${idx}" ${checked ? "checked" : ""}/>
    <span class="q">${num != null ? `<span class="qnum">${num}.</span>` : ""}${esc(text)}</span></label></div>`;
}

// 一键全选条（只出现在 A 节与 H 节这类“全部必选”的勾选组，B/C/D 的 Yes/No 项不提供）
function tickAllBar(n) {
  const zh = S.lang === "zh";
  return `<label class="tick-all"><input type="checkbox" id="tickAll"/><span>${esc(zh
    ? `一键全选以下 ${n} 项（也可逐项勾选；请先阅读各条目）`
    : `Tick all ${n} items below (you can also tick them individually; please read each item first)`)}</span></label>`;
}

// 绑定全选框与各条目的双向联动（含部分勾选时的 indeterminate 状态）
function setupTickAll() {
  const master = $("tickAll");
  if (!master) return;
  const items = [...document.querySelectorAll('#consentBody input[data-tick]')];
  const sync = () => {
    const n = items.filter(el => el.checked).length;
    master.checked = n === items.length && n > 0;
    master.indeterminate = n > 0 && n < items.length;
  };
  master.addEventListener("change", () => { items.forEach(el => { el.checked = master.checked; }); sync(); });
  items.forEach(el => el.addEventListener("change", sync));
  sync();
}

// 从当前 DOM 读取本步选择存入 state，并校验；返回是否可继续
function persistAndValidateStep() {
  const step = CONSENT_STEPS[S.consentStep];
  const err = $("consentError");
  err.textContent = "";
  if (step === "A") {
    document.querySelectorAll('#consentBody input[data-tick]').forEach(el => {
      S.consent.A[el.dataset.tick] = el.checked;
    });
    if (CONSENT_A.some((_, i) => !S.consent.A[i])) {
      err.textContent = S.lang === "zh"
        ? "A 节所有条目均为参加本研究所必需，请逐项勾选。"
        : "All items in Section A are required to take part. Please tick every box.";
      return false;
    }
  } else if (step === "B" || step === "C" || step === "D") {
    const set = step === "B" ? CONSENT_B : step === "C" ? CONSENT_C : CONSENT_D;
    const store = step === "B" ? S.consent.B : step === "C" ? S.consent.C : S.consent.D;
    for (const [id] of set) {
      const sel = document.querySelector(`#consentBody input[name="yn_${id}"]:checked`);
      if (sel) store[id] = sel.value;
    }
    const missing = set.filter(([id]) => !store[id]).map(([id]) => id);
    if (step === "C") {
      for (const [id] of CONSENT_C_LEVEL2) {
        const sel = document.querySelector(`#consentBody input[name="yn_${id}"]:checked`);
        if (sel) S.consent.C2[id] = sel.value;
      }
      const freeEl = $("consentFree"); if (freeEl) S.consent.freeText = freeEl.value;
      if (!S.consent.C2[32]) missing.push(32);
      if (!S.consent.C2[33]) missing.push(33);
      if (S.consent.C2[32] === "yes" && S.consent.C2[33] === "yes") {
        err.textContent = S.lang === "zh"
          ? "第 32 与 33 项相互矛盾（预先授权 vs. 每次都联系我），请只将其中一项选为 Yes。"
          : "Items 32 and 33 are contradictory (advance permission vs. contact me each time). Please choose only one as Yes.";
        return false;
      }
    }
    if (missing.length) {
      err.textContent = (S.lang === "zh"
        ? "请对每一项选择 Yes 或 No。未选：" : "Please select Yes or No for every item. Missing: ") + missing.join(", ") + ".";
      return false;
    }
  } else if (step === "REVIEW") {
    document.querySelectorAll('#consentBody input[data-tick]').forEach(el => {
      S.consent.H[el.dataset.tick] = el.checked;
    });
    S.consent.typedName = ($("sigName").value || "").trim();
    S.consent.agreed = $("sigAgree").checked;
    const zh = S.lang === "zh";
    if (CONSENT_H.some((_, i) => !S.consent.H[i])) {
      err.textContent = zh ? "请勾选 H 节所有声明项。" : "Please tick all declaration items in Section H."; return false;
    }
    if (!S.consent.typedName) { err.textContent = zh ? "请键入您的全名。" : "Please type your full name."; return false; }
    if (!S.consent.agreed) { err.textContent = zh ? "请勾选签名上方的同意声明。" : "Please tick the agreement statement above the signature."; return false; }
    if (!S.consent.signaturePng) { err.textContent = zh ? "请手写签名。" : "Please draw your signature."; return false; }
  }
  return true;
}

$("btnConsentBack").addEventListener("click", () => {
  // 后退不强制校验，但保存已填内容
  persistStepSoft();
  if (S.consentStep === 0) { show("screen-pis"); return; }
  S.consentStep--;
  renderConsentStep();
});

// 仅保存不校验（用于后退时不丢已填内容）
function persistStepSoft() {
  const step = CONSENT_STEPS[S.consentStep];
  if (step === "A" || step === "REVIEW") {
    const target = step === "A" ? S.consent.A : S.consent.H;
    document.querySelectorAll('#consentBody input[data-tick]').forEach(el => { target[el.dataset.tick] = el.checked; });
  }
  if (step === "B" || step === "C" || step === "D") {
    const set = step === "B" ? CONSENT_B : step === "C" ? CONSENT_C : CONSENT_D;
    const store = step === "B" ? S.consent.B : step === "C" ? S.consent.C : S.consent.D;
    for (const [id] of set) {
      const sel = document.querySelector(`#consentBody input[name="yn_${id}"]:checked`); if (sel) store[id] = sel.value;
    }
  }
  if (step === "C") {
    for (const [id] of CONSENT_C_LEVEL2) {
      const sel = document.querySelector(`#consentBody input[name="yn_${id}"]:checked`); if (sel) S.consent.C2[id] = sel.value;
    }
    const freeEl = $("consentFree"); if (freeEl) S.consent.freeText = freeEl.value;
  }
  if (step === "REVIEW") {
    const n = $("sigName"); if (n) S.consent.typedName = n.value.trim();
    const a = $("sigAgree"); if (a) S.consent.agreed = a.checked;
  }
}

$("btnConsentNext").addEventListener("click", async () => {
  if (S.consentSubmitting) return;   // 提交/上传进行中：忽略重复点击，避免重复下载/重复提交
  if (!persistAndValidateStep()) {
    $("consentError").scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  if (S.consentStep < CONSENT_STEPS.length - 1) {
    S.consentStep++;
    renderConsentStep();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  // 最后一步：签名并提交。提交期间锁定按钮，防止重复触发。
  S.consentSubmitting = true;
  $("btnConsentNext").disabled = true;
  $("btnConsentBack").disabled = true;
  try {
    await submitConsent();
  } finally {
    S.consentSubmitting = false;
    $("btnConsentNext").disabled = false;
    $("btnConsentBack").disabled = false;
  }
});

/* ---- 手写签名画布 ---- */
function setupSignatureCanvas() {
  const cv = $("sigCanvas");
  const ctx = cv.getContext("2d");
  // 用显示尺寸设置位图分辨率（含 DPR），保证清晰
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  cv.width = Math.max(rect.width, 1) * dpr;
  cv.height = Math.max(rect.height, 1) * dpr;
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
  let drawing = false, has = false, last = null;
  const pos = (e) => {
    const r = cv.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const start = (e) => { e.preventDefault(); drawing = true; last = pos(e); };
  const move = (e) => {
    if (!drawing) return; e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; has = true;
  };
  const end = () => {
    if (!drawing) return; drawing = false;
    if (has) S.consent.signaturePng = cv.toDataURL("image/png");
  };
  cv.addEventListener("mousedown", start); cv.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  cv.addEventListener("touchstart", start, { passive: false });
  cv.addEventListener("touchmove", move, { passive: false });
  cv.addEventListener("touchend", end);
  $("sigClear").addEventListener("click", () => {
    ctx.clearRect(0, 0, cv.width, cv.height); has = false; S.consent.signaturePng = null;
  });
  // 若返回本步，重绘之前的签名
  if (S.consent.signaturePng) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = S.consent.signaturePng;
    has = true;
  }
}

/* ---- 提交同意：生成 subject_id、记录（json/html/pdf/png）、上传、给副本 ---- */
async function submitConsent() {
  // 生成匿名 subject_id（参与者编号，不含姓名——与 PIS 的假名化承诺一致；姓名仅存于同意书记录）
  const stamp = currentTimestamp();
  const rand = Math.random().toString(36).slice(2, 6);
  S.subject = { name: S.consent.typedName, subject_id: `P${stamp}_${rand}`,
                created_at: stamp, language: S.lang };

  const rec = buildConsentRecord();
  rec.stamp = stamp;
  S.consentRecord = rec;
  saveSessionMeta();          // 同意一提交就落盘，之后崩溃也不必重签

  // 生成 PDF：英文（矢量，权威版，供 Nature）始终生成；中文显示时额外生成中文（图片版）
  try { S.consentPdfEn = await buildConsentPdf(rec, "en"); }
  catch (e) { console.error("consent PDF (en) failed", e); S.consentPdfEn = null; }
  if (S.lang === "zh") {
    try { S.consentPdfZh = await buildConsentPdf(rec, "zh"); }
    catch (e) { console.error("consent PDF (zh) failed", e); S.consentPdfZh = null; }
  } else S.consentPdfZh = null;

  // 立即给参与者一份其阅读语言的可下载副本（附录要求）——优先 PDF
  const dlPdf = (S.lang === "zh" && S.consentPdfZh) ? S.consentPdfZh : S.consentPdfEn;
  if (dlPdf) downloadBytes(dlPdf, "application/pdf", `${rec.subject_id}_consent_${S.lang}.pdf`);
  else downloadBytes(new TextEncoder().encode(consentToHtml(rec, S.lang)), "text/html", `${rec.subject_id}_consent_${S.lang}.html`);

  // 上传到 Drive 的 <subject_id>/consent/（时间戳命名、不覆盖）——失败也放行，
  // 记录仍在最终 zip 里，不会丢；但会提示。
  if (UPLOAD_URL) {
    const zh = S.lang === "zh";
    $("consentError").style.color = "#0ca88f";
    $("consentError").textContent = zh ? "正在上传同意记录…" : "Uploading consent record…";
    try {
      await uploadConsent(rec);
      $("consentError").textContent = zh ? "同意记录已保存并上传 ✓" : "Consent recorded and uploaded ✓";
    } catch (e) {
      console.error(e);
      $("consentError").style.color = "#d4506c";
      $("consentError").textContent = zh
        ? "同意记录已保存并下载到本机，但云端上传失败。"
        : "Consent saved & downloaded, but cloud upload failed. A copy was downloaded to this device.";
    }
  }
  // 进入「同意完成 -> 开始数据收集」过渡页，再到注册页
  renderConsentDone();
  show("screen-consent-done");
}

function downloadBytes(bytes, mime, fname) {
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  const a = document.createElement("a");
  a.href = url; a.download = fname; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function bytesToBase64(bytes) {
  let bin = ""; const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(bin);
}

function buildConsentRecord() {

function latin1Bytes(s) {
  const b = new Uint8Array(s.length);

// 优先用官方可填写 PDF 模板（pdf-lib）；失败则回退 canvas 图片版
async function buildConsentPdf(rec, lang) {

async function buildConsentPdfCanvas(rec, lang) {
  lang = lang || "en";
  const zh = lang === "zh", a = rec.answers, D = CONSENT_DOC;
  const LL = (o) => (o && (o[lang] != null ? o[lang] : o.en)) || "";
  const tx = (x) => zh ? (x.text_zh || x.text_en) : x.text_en;
  const s = 2, Wpt = 595, Hpt = 842;
  const cw = Wpt * s, chh = Hpt * s, M = 46 * s, bottom = 46 * s, W = cw - 2 * M;
  const FF = 'Helvetica,Arial,"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif';
  const font = (px, b) => `${b ? "bold " : ""}${px * s}px ${FF}`;
  const pages = []; let cv, ctx, y;
  const newPage = () => {
    cv = document.createElement("canvas"); cv.width = cw; cv.height = chh;
    ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cw, chh);
    ctx.textBaseline = "top"; y = M;
  };
  newPage();
  const brk = (h) => { if (y + h > chh - bottom) { pages.push(cv); newPage(); return true; } return false; };
  const wrap = (text, px, b, maxW) => {
    ctx.font = font(px, b);
    const toks = String(text).match(/[A-Za-z0-9@._%+\-\/:]+|\s|[^\sA-Za-z0-9]/g) || [];
    const out = []; let cur = "";
    for (const tk of toks) { const t = cur + tk; if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { out.push(cur.replace(/\s+$/, "")); cur = tk === " " ? "" : tk; } }
    if (cur.trim() !== "" || !out.length) out.push(cur);
    return out;
  };
  const para = (text, px, b, x, color, maxW) => {
    x = x == null ? M : x; maxW = maxW == null ? (W - (x - M)) : maxW;
    const lines = wrap(text, px, b, maxW), lh = px * s * 1.45;
    ctx.fillStyle = color || "#111"; ctx.font = font(px, b);
    for (const ln of lines) { brk(lh); ctx.fillText(ln, x, y); y += lh; }
  };

function assembleImagePdf(images, Wpt, Hpt) {

  for (let i = 0; i < P; i++) {

    startObj(imgIds[i]);
    push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);
    push(im.bytes); push("\nendstream\n"); endObj();
    const content = `q ${Wpt} 0 0 ${Hpt} 0 0 cm /Im0 Do Q`, cb = latin1Bytes(content);
    startObj(pageIds[i]);
    push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${Wpt} ${Hpt}] /Resources << /XObject << /Im0 ${imgIds[i]} 0 R >> >> /Contents ${contentIds[i]} 0 R >>\n`); endObj();
    startObj(contentIds[i]);

  for (let n = 1; n < N; n++) xref += String(off[n] || 0).padStart(10, "0") + " 00000 n \n";

  push(`trailer\n<< /Size ${N} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);

/* --------------------------------------------------------------------- *
 *  用官方可填写 PDF 模板生成填好的同意书（pdf-lib，自托管本地库，不联网第三方）
 *  模板：同目录 consent_template_en.pdf / consent_template_zh.pdf
 *  Latin 文本 -> 真实可选中文字；含中文的姓名/自由文本 -> 渲染成图片盖到字段位置
 *  （避免内嵌大字体）；手写签名盖到 signature 字段处；最后 flatten 扁平化。
 * --------------------------------------------------------------------- */
const _loadedScripts = {};
function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (_loadedScripts[src]) return resolve();
    const s = document.createElement("script");
    s.src = src; s.onload = () => { _loadedScripts[src] = true; resolve(); };
    s.onerror = () => reject(new Error("failed to load " + src));
    document.head.appendChild(s);
  });
}
const isLatin1 = (s) => /^[\x00-\xFF]*$/.test(String(s));
function dataUrlToBytes(dataurl) {
  const b64 = String(dataurl).split(",")[1] || "";
  const bin = atob(b64); const by = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i);
  return by;
}
// 把文本渲染成透明底 PNG（用于中文姓名/自由文本或任意非 Latin 值），按字段矩形大小
function textToPngBytes(text, wPt, hPt) {
  const scale = 3, multi = hPt > 26;
  const cw = Math.max(1, Math.round(wPt * scale)), ch = Math.max(1, Math.round(hPt * scale));
  const c = document.createElement("canvas"); c.width = cw; c.height = ch;
  const x = c.getContext("2d");
  const fpx = Math.min(multi ? 10 : hPt * 0.62, 12) * scale;
  x.font = `${fpx}px "PingFang SC","Microsoft YaHei","Heiti SC",Helvetica,Arial,sans-serif`;
  x.fillStyle = "#111"; x.textBaseline = multi ? "top" : "middle";
  const pad = 2 * scale;
  if (multi) {
    const words = String(text).split(/(\s+)/); const lines = []; let cur = "";
    const toks = String(text).match(/[A-Za-z0-9@._%+\-\/:]+|\s|[^\sA-Za-z0-9]/g) || [];
    for (const tk of toks) { const t = cur + tk; if (x.measureText(t).width <= cw - 2 * pad || !cur) cur = t; else { lines.push(cur.replace(/\s+$/, "")); cur = tk === " " ? "" : tk; } }
    if (cur) lines.push(cur);
    let yy = pad, lh = fpx * 1.35;
    for (const ln of lines) { if (yy + lh > ch) break; x.fillText(ln, pad, yy); yy += lh; }
  } else {
    x.fillText(String(text), pad, ch / 2);
  }
  const jpg = c.toDataURL("image/png").split(",")[1];
  const bin = atob(jpg); const by = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i);
  return by;
}

async function fillConsentPdfTemplate(rec, lang) {
  await loadScriptOnce("lib/pdf-lib.min.js");
  const PDFLib = window.PDFLib;
  if (!PDFLib) throw new Error("pdf-lib not available");
  const res = await fetch(`consent_template_${lang}.pdf`, { cache: "no-store" });
  if (!res.ok) throw new Error(`template consent_template_${lang}.pdf not found (${res.status})`);
  const bytes = new Uint8Array(await res.arrayBuffer());
  const doc = await PDFLib.PDFDocument.load(bytes);
  const form = doc.getForm();
  const a = rec.answers;

  const checkOn = (name) => { try { form.getCheckBox(name).check(); } catch (e) { /* 字段不存在则忽略 */ } };
  const cjkJobs = []; // {name, val}
  const setText = (name, val) => {
    if (val == null || val === "") return;
    try {
      const f = form.getTextField(name);
      if (isLatin1(val)) f.setText(String(val));
      else cjkJobs.push({ name, val: String(val) });
    } catch (e) { /* 字段不存在则忽略 */ }
  };

  // A 节勾选
  a.section_A_required.forEach((x, i) => { if (x.agreed) checkOn(`A${i + 1}`); });
  // B/C/D + Level2 的 Yes/No
  const yn = (prefix, arr) => arr.forEach(x => { if (x.answer === "yes") checkOn(`${prefix}${x.id}_yes`); else if (x.answer === "no") checkOn(`${prefix}${x.id}_no`); });
  yn("B", a.section_B); yn("C", a.section_C); yn("C", a.section_C_level2); yn("D", a.section_D);
  // E 节：本研究 = 第 1 条
  checkOn("E1");
  // H 节
  a.section_H_declaration.forEach((x, i) => { if (x.agreed) checkOn(`H${i + 1}`); });

  // 文本字段
  setText("participant_name", rec.participant_name);
  setText("participant_id", rec.subject_id);
  setText("participant_datetime", rec.consent_datetime_local);
  setText("level2_additional", a.level2_additional_restrictions);
  setText("withdrawal_research_contact", RESEARCH_CONTACT.replace(/\n/g, " | "));
  // 取得同意者 / 负责研究者：固定为 Lead Researcher，时间与参与者签署时刻一致
  setText("researcher_name", "Jingyi Wan");
  setText("researcher_role", "Lead Researcher");
  setText("researcher_datetime", rec.consent_datetime_local);
  setText("ec_consent_form_version", "v" + rec.consent_form_version);
  setText("ec_pis_version", "v" + rec.pis_version);
  setText("ec_signature_method", rec.signature_method);
  setText("ec_record_datetime", rec.consent_datetime_local + " (" + rec.timezone + ")");
  setText("ec_audit_id", rec.audit_id);
  setText("ec_copy_method", "Automatic download in the participant's browser at submission");

  // 采集需要“盖图”的字段矩形（签名 + 含中文的文本），必须在 flatten 之前
  const stamps = [];
  const fieldRectPage = (name) => {
    const f = form.getField(name);
    const w = f.acroField.getWidgets()[0];
    const r = w.getRectangle();
    const wdict = w.dict;
    const pages = doc.getPages();
    let page = pages[0];
    outer: for (const p of pages) {
      const annots = p.node.Annots && p.node.Annots();
      if (!annots) continue;
      const arr = annots.asArray ? annots.asArray() : [];
      for (const el of arr) {
        const obj = (el instanceof PDFLib.PDFRef) ? doc.context.lookup(el) : el;
        if (obj === wdict) { page = p; break outer; }
      }
    }
    return { page, rect: r };
  };
  if (rec.signature_png_dataurl) { try { stamps.push({ ...fieldRectPage("signature"), kind: "sig" }); } catch (e) { /* ignore */ } }
  for (const job of cjkJobs) { try { stamps.push({ ...fieldRectPage(job.name), kind: "text", val: job.val }); } catch (e) { /* ignore */ } }

  form.flatten();

  for (const st of stamps) {
    try {
      if (st.kind === "sig") {
        const png = await doc.embedPng(dataUrlToBytes(rec.signature_png_dataurl));
        const asp = png.width / png.height;
        let h = Math.min(32, st.rect.height * 1.8), wd = h * asp;
        if (wd > st.rect.width) { wd = st.rect.width; h = wd / asp; }
        // 垂直居中于签名框（超出部分上下均摊），避免签名整体压到上一行
        const sy = st.rect.y + (st.rect.height - h) / 2;
        st.page.drawImage(png, { x: st.rect.x + 2, y: sy, width: wd, height: h });
      } else {
        const png = await doc.embedPng(textToPngBytes(st.val, st.rect.width, st.rect.height));
        st.page.drawImage(png, { x: st.rect.x, y: st.rect.y, width: st.rect.width, height: st.rect.height });
      }
    } catch (e) { console.warn("stamp failed", st, e); }
  }
  return await doc.save();  // Uint8Array
}
