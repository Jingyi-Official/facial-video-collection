/* --------------------------------------------------------------------- *
 *  摄像头
 * --------------------------------------------------------------------- */
async function openCamera(deviceId) {
  // 优先横屏 16:9；指定 deviceId 时用所选摄像头，否则用前置默认
  const videoCfg = { width: { ideal: 3840 }, height: { ideal: 2160 }, aspectRatio: { ideal: 16 / 9 } };
  if (deviceId) videoCfg.deviceId = { exact: deviceId }; else videoCfg.facingMode = "user";
  if (S.camStream) { for (const tr of S.camStream.getTracks()) tr.stop(); S.camStream = null; }
  try {
    // 同时申请摄像头与麦克风（录制包含音频）
    S.camStream = await navigator.mediaDevices.getUserMedia({ video: videoCfg, audio: true });
  } catch (e) {
    console.error("camera+mic failed, retrying video-only:", e);
    // 麦克风被拒/不可用时回退为仅视频，避免完全无法录制
    try {
      S.camStream = await navigator.mediaDevices.getUserMedia({ video: videoCfg, audio: false });
    } catch (e2) {
      console.error(e2);
      return false;
    }
  }
  const track = S.camStream.getVideoTracks()[0];
  const st = track.getSettings();
  S.camSettings = { width: st.width || 1280, height: st.height || 720 };
  S.camDeviceId = st.deviceId || deviceId || null;
  const src = $("camSrc");
  src.srcObject = S.camStream;
  await src.play().catch(()=>{});
  populateCameraSelect(); // 有权限后能拿到设备名，异步填充下拉
  await initDetector();
  return true;
}

// 摄像头选择下拉：仅当有多个视频输入设备时显示
async function populateCameraSelect() {
  const sel = $("camSelect"), row = $("camSelRow");
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    sel.innerHTML = devs.map((d, i) =>
      `<option value="${esc(d.deviceId)}"${d.deviceId === S.camDeviceId ? " selected" : ""}>${esc(d.label || `Camera ${i + 1}`)}</option>`).join("");
    $("camSelLbl").textContent = S.lang === "zh" ? "摄像头" : "Camera";
    row.style.display = devs.length > 1 ? "" : "none";
  } catch (e) { row.style.display = "none"; }
}
$("camSelect").addEventListener("change", async () => {
  const ok = await openCamera($("camSelect").value);
  if (ok) startCameraTest(); else alert(t("cam_fail"));
});

async function initDetector() {
  if (S.detectorReady) return; // 切换摄像头重开时无需重建检测器
  try {
    const { FaceDetector, FilesetResolver } = await import(`${MEDIAPIPE_BASE}/vision_bundle.mjs`);
    const fileset = await FilesetResolver.forVisionTasks(`${MEDIAPIPE_BASE}/wasm`);
    S.faceDetector = await FaceDetector.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: "./models/blaze_face_short_range.tflite",
      },
      runningMode: "VIDEO",
    });
    S.detectorReady = true;
  } catch (e) {
    console.warn("Face detector failed to load; falling back to manual alignment.", e);
    S.detectorReady = false;
  }
}

function ovalParams(w, h) {
  return { ocx: OVAL.cx*w, ocy: OVAL.cy*h, orx: OVAL.rx*w, ory: OVAL.ry*h };
}

function faceInOval(face, w, h) {
  if (!face) return false;
  const cx = face.x + face.w/2, cy = face.y + face.h/2;
  const { ocx, ocy, orx, ory } = ovalParams(w, h);
  const inside = ((cx-ocx)/orx)**2 + ((cy-ocy)/ory)**2 <= 1.0;
  const sizeOk = 0.7*orx <= face.w/2 && face.w/2 <= 1.6*orx;
  return inside && sizeOk;
}

// 检测并返回镜像坐标系下的人脸框（与绘制坐标一致）
let _detectTs = 0;  // 页面级单调递增时钟（微秒级步进）
function detectMirrored(video, w, h, tsMs) {
  if (!S.detectorReady) return null;
  // MediaPipe 要求时间戳严格递增；video.mediaTime 在切换/重开摄像头流时会归零，
  // 导致 "Packet timestamp mismatch" 每帧报错、检测失效。故忽略传入 tsMs，改用
  // 只增不减的页面时钟，彻底避免时间戳倒退。
  _detectTs = Math.max(_detectTs + 1, Math.round(performance.now()));
  let res;
  try { res = S.faceDetector.detectForVideo(video, _detectTs); }
  catch { return null; }
  if (!res || !res.detections || res.detections.length === 0) return null;
  // 取最大人脸
  let best = null;
  for (const d of res.detections) {
    const bb = d.boundingBox;
    if (!best || bb.width*bb.height > best.boundingBox.width*best.boundingBox.height) best = d;
  }
  const bb = best.boundingBox;
  // 6 个关键点（归一化坐标）：0/1 双眼、2 鼻尖、3 嘴、4/5 耳屏点；一并转换到镜像像素坐标
  const kps = (best.keypoints || []).map(k => ({ x: w - k.x * w, y: k.y * h }));
  // detectForVideo 返回的是原始（未镜像）坐标；转换到镜像绘制坐标
  return { x: w - (bb.originX + bb.width), y: bb.originY, w: bb.width, h: bb.height, kps };
}

/* 正脸姿态粗检（仅摄像头检查步骤使用）：基于 FaceDetector 的关键点，
 * 返回问题的文案 key（pose_up/pose_down/pose_turn/pose_tilt），正脸则返回 null。
 * 阈值刻意宽松：只拦明显的仰头/低头/侧脸/歪头，不为难正常坐姿。 */
function frontalPoseIssue(face) {
  if (!face || !face.kps || face.kps.length < 4) return null; // 关键点缺失时不阻拦
  const [e1, e2, nose, mouth] = face.kps;
  const eyeMid = { x: (e1.x + e2.x) / 2, y: (e1.y + e2.y) / 2 };
  const eyeDist = Math.hypot(e2.x - e1.x, e2.y - e1.y) || 1;
  // 歪头：眼线相对水平的夹角
  const rollDeg = Math.abs(Math.atan2(e2.y - e1.y, e2.x - e1.x) * 180 / Math.PI);
  if (Math.min(rollDeg, 180 - rollDeg) > 14) return "pose_tilt";
  // 左右转头：鼻尖到左右眼的水平距离对称性
  const dL = Math.abs(nose.x - Math.min(e1.x, e2.x)), dR = Math.abs(Math.max(e1.x, e2.x) - nose.x);
  if (Math.min(dL, dR) / Math.max(dL, dR) < 0.35) return "pose_turn";
  // 仰头/低头：鼻尖在「眼线 -> 嘴」区间中的相对位置（正脸约 0.5–0.7）
  const span = mouth.y - eyeMid.y;
  if (span > eyeDist * 0.2) {
    const t = (nose.y - eyeMid.y) / span;
    if (t < 0.32) return "pose_up";
    if (t > 0.85) return "pose_down";
  }
  return null;
}

function drawFrameMirrored(ctx, video, w, h) {
  ctx.save();
  ctx.translate(w, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, w, h);
  ctx.restore();
}

function drawOvalGuide(ctx, w, h, aligned) {
  const { ocx, ocy, orx, ory } = ovalParams(w, h);
  ctx.lineWidth = Math.max(3, w/500);
  ctx.strokeStyle = aligned ? "rgb(94,234,212)" : "rgb(255,107,129)";
  ctx.beginPath(); ctx.ellipse(ocx, ocy, orx, ory, 0, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = ctx.strokeStyle;
  ctx.font = `bold ${Math.round(h/22)}px Helvetica`;
  ctx.textAlign = "center";
  ctx.fillText(aligned ? "Face OK" : "Move into the outline", ocx, ocy+ory+h/18);
}

function drawCountdown(ctx, w, h, text) {
  const { ory } = ovalParams(w, h);
  const { ocx, ocy } = ovalParams(w, h);
  const size = Math.round(1.6 * ory);
  ctx.font = `bold ${size}px Helvetica`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = Math.max(8, size/12); ctx.strokeStyle = "rgb(0,0,0)";
  ctx.strokeText(text, ocx, ocy);
  ctx.fillStyle = "rgb(255,255,255)"; ctx.fillText(text, ocx, ocy);
  ctx.textBaseline = "alphabetic";
}

function drawRecBadge(ctx, w, h) {
  const r = Math.max(10, w/90);
  ctx.fillStyle = "rgb(255,107,129)";
  ctx.beginPath(); ctx.arc(r+18, r+18, r, 0, Math.PI*2); ctx.fill();
  ctx.font = `bold ${Math.round(h/22)}px Helvetica`;
  ctx.textAlign = "left"; ctx.fillText("REC", r*2+26, r+26);
}

function sizeStage(stageId, w, h) {
  const stage = $(stageId);
  stage.style.aspectRatio = `${w} / ${h}`;
}

/* --------------------------------------------------------------------- *
 *  3. 摄像头测试页
 * --------------------------------------------------------------------- */
let testAligned = 0;

function startCameraTest() {
  $("camPartLabel").textContent = t("part2_label");
  $("camHeader").textContent = t("camtest_header");
  $("camSub").textContent = t("camtest_sub");
  $("testStatus").textContent = t("detecting");
  $("btnStartRec").textContent = t("start_record");
  $("btnStartRec").disabled = true;
  document.querySelectorAll("[data-rotate]").forEach(el => { el.textContent = t("rotate_hint"); });
  show("screen-camtest");

  const { width:w, height:h } = S.camSettings;
  const canvas = $("testCanvas"), overlay = $("testOverlay");
  canvas.width = overlay.width = w; canvas.height = overlay.height = h;
  sizeStage("stageTest", w, h);
  testAligned = 0;

  if (!S.detectorReady) {
    // 无检测：允许手动开始
    $("testStatus").textContent = t("manual_ok");
    $("testStatus").style.color = "#b3861f";
    $("btnStartRec").disabled = false;
  }
  cancelRaf();
  const ctx = canvas.getContext("2d"), octx = overlay.getContext("2d");
  const src = $("camSrc");
  function loop(now, meta) {
    drawFrameMirrored(ctx, src, w, h);
    octx.clearRect(0, 0, w, h);
    let aligned = false;
    if (S.detectorReady) {
      const face = detectMirrored(src, w, h, meta ? meta.mediaTime*1000 : now);
      const inOval = faceInOval(face, w, h);
      const poseIssue = inOval ? frontalPoseIssue(face) : null; // 位置合适后再查姿态
      aligned = inOval && !poseIssue;
      drawOvalGuide(octx, w, h, aligned);
      testAligned = aligned ? testAligned+1 : 0;
      if (testAligned >= 10) {
        $("testStatus").textContent = t("face_ok");
        $("testStatus").style.color = "#0ca88f";
        $("btnStartRec").disabled = false;
      } else {
        $("testStatus").textContent = poseIssue ? t(poseIssue) : t("move_in");
        $("testStatus").style.color = "#b3861f";
        $("btnStartRec").disabled = true;
      }
    } else {
      drawOvalGuide(octx, w, h, false);
    }
    S.rafId = src.requestVideoFrameCallback(loop);
  }
  S.rafId = src.requestVideoFrameCallback(loop);
}

function cancelRaf() {
  if (S.rafId != null) { try { $("camSrc").cancelVideoFrameCallback(S.rafId); } catch {} S.rafId = null; }
}

$("btnStartRec").addEventListener("click", () => {
  cancelRaf();
  S.emotionIdx = S.resumeIdx != null ? S.resumeIdx : 0;   // 续录时接着上次的进度
  S.resumeIdx = null;
  showRecordPage();
});

/* --------------------------------------------------------------------- *
 *  4. 录制页
 * --------------------------------------------------------------------- */
function showRecordPage() {
  show("screen-record");
  const { width:w, height:h } = S.camSettings;
  const canvas = $("recCanvas"), overlay = $("recOverlay");
  canvas.width = overlay.width = w; canvas.height = overlay.height = h;
  sizeStage("stageRec", w, h);
  document.querySelectorAll("[data-rotate]").forEach(el => { el.textContent = t("rotate_hint"); });
  requestWakeLock();          // 手机端防止息屏中断录制（电脑端不请求）
  loadEmotion();
}

function loadEmotion() {
  stopReview();
  const emotion = EMOTIONS[S.emotionIdx];
  $("recPartLabel").textContent = t("part2_label");
  $("progressLbl").textContent = t("progress",
    { i: S.emotionIdx+1, n: EMOTIONS.length, sid: S.subject.subject_id });
  $("emotionLbl").textContent = t("target", { name: EMOTION_HINT[S.lang][emotion] || emotion });
  $("descLbl").textContent = EMOTION_DESC[S.lang][emotion] || "";
  S.countdownNum = null;
  $("bigStatus").textContent = "";
  $("bigStatus").style.color = "#e04c64";
  $("hintLbl").textContent = t(IS_MOBILE ? "hint_idle_tap" : "hint_idle");
  $("hintLbl").style.color = "";        // 清掉上一段可能残留的丢帧告警配色
  $("btnRow").innerHTML = "";
  S.state = "idle";
  updateRecControls();
  startLivePreview();
}

function startLivePreview() {
  const { width:w, height:h } = S.camSettings;
  $("recCanvas").style.display = "block";
  $("reviewVideo").style.display = "none";
  const ctx = $("recCanvas").getContext("2d");
  const octx = $("recOverlay").getContext("2d");
  const src = $("camSrc");
  cancelRaf();
  function loop(now, meta) {
    // 干净镜像帧（这一层会被录制）
    drawFrameMirrored(ctx, src, w, h);
    // 叠加层（不录制）
    octx.clearRect(0, 0, w, h);
    if (S.state === "idle" || S.state === "counting") {
      const face = detectMirrored(src, w, h, meta ? meta.mediaTime*1000 : now);
      drawOvalGuide(octx, w, h, faceInOval(face, w, h));
      if (S.state === "counting" && S.countdownNum) drawCountdown(octx, w, h, S.countdownNum);
    } else if (S.state === "recording") {
      drawRecBadge(octx, w, h);
      S.recordFrameTimes.push(meta ? meta.mediaTime : now/1000);
      // presentedFrames 是视频元素累计呈现的帧序号；相邻两次回调差值 >1 即为确凿丢帧
      S.recordPresented.push(meta && meta.presentedFrames != null ? meta.presentedFrames : null);
    }
    if (S.state !== "review") S.rafId = src.requestVideoFrameCallback(loop);
  }
  S.rafId = src.requestVideoFrameCallback(loop);
}

window.addEventListener("keydown", (e) => {
  if (e.code !== "Space") return;
  if (!$("screen-record").classList.contains("active")) return;
  e.preventDefault();
  if (S.state === "idle") beginCountdown();
  else if (S.state === "recording") stopRecording();
});

/* 手机端：屏幕上的开始/停止录制按钮。电脑端不渲染任何按钮，仍然只用空格键。 */
function updateRecControls() {
  if (!IS_MOBILE) return;
  const row = $("btnRow");
  if (S.state === "review") return;            // 回放阶段的按钮由 showReview 负责
  row.innerHTML = "";
  const b = document.createElement("button");
  b.className = "primary tap-rec";
  if (S.state === "recording") {
    b.classList.add("stop"); b.textContent = t("tap_stop"); b.onclick = stopRecording;
  } else if (S.state === "counting") {
    b.textContent = t("tap_counting"); b.disabled = true;
  } else {
    b.textContent = t("tap_start"); b.onclick = beginCountdown;
  }
  row.appendChild(b);
}

/* 手机端屏幕常亮：息屏会中断摄像头逐帧回调与录制（电脑端不请求） */
let wakeLock = null;
async function requestWakeLock() {
  if (!IS_MOBILE || !navigator.wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch { wakeLock = null; }
}
async function releaseWakeLock() {
  try { if (wakeLock) await wakeLock.release(); } catch {}
  wakeLock = null;
}
document.addEventListener("visibilitychange", () => {   // 切回前台后重新申请
  if (document.visibilityState === "visible" && !wakeLock &&
      $("screen-record").classList.contains("active")) requestWakeLock();
});

function beginCountdown() {
  if (S.state !== "idle") return;
  S.state = "counting";
  updateRecControls();
  countdown(COUNTDOWN_SEC);
}

function countdown(n) {
  if (S.state !== "counting") return;
  if (n > 0) {
    S.countdownNum = String(n);
    $("bigStatus").textContent = "";
    setTimeout(() => countdown(n-1), 1000);
  } else {
    S.countdownNum = null;
    $("bigStatus").textContent = t("rec_badge");
    $("bigStatus").style.color = "#e04c64";
    startRecording();
  }
}

function pickMime() {
  // 优先 mp4 (H.264/AVC + AAC)：支持的浏览器直接出 mp4，无需转码；
  // 不支持的自动回退到 webm (VP9/VP8 + Opus)。均声明音频编码以携带麦克风音轨。
  const cands = [
    ["video/mp4;codecs=avc1.640028,mp4a.40.2","mp4"], ["video/mp4;codecs=avc1.42E01E,mp4a.40.2","mp4"],
    ["video/mp4;codecs=h264,aac","mp4"], ["video/mp4","mp4"],
    ["video/webm;codecs=vp9,opus","webm"], ["video/webm;codecs=vp8,opus","webm"],
    ["video/webm","webm"],
  ];
  for (const [m, ext] of cands) if (MediaRecorder.isTypeSupported(m)) return { mime:m, ext };
  return { mime:"", ext:"webm" };
}

function startRecording() {
  S.recordFrameTimes = [];
  S.recordPresented = [];
  S.recChunks = [];
  const stream = $("recCanvas").captureStream(); // 录制干净的镜像画布（无叠加层）
  // 附加麦克风音轨，使成片包含同期音频
  if (S.camStream) for (const at of S.camStream.getAudioTracks()) stream.addTrack(at);
  const { mime, ext } = pickMime();
  S.mimeExt = ext;
  // 显式指定码率：不依赖浏览器默认值，保证画质与手机/电脑之间的一致性
  const vTrack = S.camStream && S.camStream.getVideoTracks()[0];
  const srcFps = (vTrack && vTrack.getSettings().frameRate) || 30;
  const { width:vw, height:vh } = S.camSettings;
  const opts = mime ? { mimeType: mime } : {};
  opts.videoBitsPerSecond = targetVideoBitrate(vw, vh, srcFps);
  opts.audioBitsPerSecond = AUDIO_BITRATE;
  try {
    S.recorder = new MediaRecorder(stream, opts);
  } catch (e) {
    // 极少数浏览器拒绝码率参数时回退到默认值，宁可画质降级也不能录不成
    console.warn("MediaRecorder rejected bitrate options; falling back to defaults:", e);
    S.recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  }
  S.recSettings = {                      // 留档：请求值与浏览器实际采用值
    video_bitrate_requested_bps: opts.videoBitsPerSecond,
    video_bitrate_effective_bps: S.recorder.videoBitsPerSecond || null,
    audio_bitrate_effective_bps: S.recorder.audioBitsPerSecond || null,
    source_frame_rate: srcFps,
    bits_per_pixel: VIDEO_BPP,
  };
  S.recorder.ondataavailable = (e) => { if (e.data && e.data.size) S.recChunks.push(e.data); };
  S.recorder.onstop = finalizeRecording;
  S.recorder.start();
  S.state = "recording";
  $("hintLbl").textContent = t(IS_MOBILE ? "hint_recording_tap" : "hint_recording");
  updateRecControls();
}

function stopRecording() {
  if (S.recorder && S.recorder.state !== "inactive") S.recorder.stop();
}

function finalizeRecording() {
  const times = S.recordFrameTimes.slice();
  const presented = S.recordPresented.slice();
  cancelRaf();
  // 清掉叠加层残留的 REC 徽标，避免盖在回放画面上
  const oc = $("recOverlay"); oc.getContext("2d").clearRect(0, 0, oc.width, oc.height);
  if (S.recChunks.length === 0 || times.length === 0) {
    S.state = "idle"; $("bigStatus").textContent = "";
    alert(t("no_frames")); startLivePreview(); return;
  }
  const blob = new Blob(S.recChunks, { type: S.recorder.mimeType || "video/webm" });
  const t0 = times[0];
  const rel = times.map(x => x - t0);
  let fps;
  if (rel.length >= 2) fps = (rel.length - 1) / Math.max(rel[rel.length-1], 1e-3);
  else fps = 30;
  fps = Math.min(Math.max(fps, 1), 120);

  // 丢帧统计：drops[i] = 第 i 帧之前被跳过的帧数（主线程卡顿导致相机帧未被呈现）
  const drops = presented.map((p, i) =>
    (i === 0 || p == null || presented[i-1] == null) ? 0 : Math.max(0, p - presented[i-1] - 1));
  const dropped = drops.reduce((a, b) => a + b, 0);
  if (dropped) {
    console.warn(`[${EMOTIONS[S.emotionIdx]}] 丢帧 ${dropped} 帧（记录 ${rel.length} 帧，` +
                 `采集期间相机共呈现 ${rel.length + dropped} 帧）`);
  }

  S.cur = { blob, ext: S.mimeExt, timestamps: rel, fps, presented, drops, dropped };
  S.state = "review";
  const cv = $("recCanvas");   // 录制画布尺寸即成片分辨率
  $("bigStatus").textContent = t("done", { n: rel.length, fps: fps.toFixed(1), w: cv.width, h: cv.height });
  $("bigStatus").style.color = "#0ca88f";
  showReview();
}

function showReview() {
  const row = $("btnRow"); row.innerHTML = "";
  const mk = (label, fn) => {
    const b = document.createElement("button");
    b.className = "secondary"; b.textContent = label; b.onclick = fn; row.appendChild(b);
  };
  mk(t("replay"), playRecorded);
  mk(t("redo"), redo);
  mk(t("keep_next"), accept);
  // 丢帧超过阈值时提示当场重录——事后才发现质量问题就来不及了
  const cur = S.cur;
  const total = (cur.timestamps.length + (cur.dropped || 0)) || 1;
  const ratio = (cur.dropped || 0) / total;
  if (ratio >= DROP_WARN_RATIO) {
    $("hintLbl").textContent = t("drop_warn", { n: cur.dropped, p: (ratio * 100).toFixed(1) });
    $("hintLbl").style.color = "var(--bad)";
  } else {
    $("hintLbl").textContent = t("hint_review");
    $("hintLbl").style.color = "";
  }
  playRecorded();
}

function playRecorded() {
  stopReview();
  if (!S.cur) return;
  $("recCanvas").style.display = "none";
  const v = $("reviewVideo");
  v.style.display = "block";
  v.className = ""; // 移除 hidden-src
  S.reviewUrl = URL.createObjectURL(S.cur.blob);
  v.src = S.reviewUrl;
  v.muted = false; // 回放时开启声音，便于参与者确认音频
  v.play().catch(()=>{});
}

function stopReview() {
  const v = $("reviewVideo");
  v.pause(); v.removeAttribute("src"); v.load();
  v.className = "hidden-src";
  if (S.reviewUrl) { URL.revokeObjectURL(S.reviewUrl); S.reviewUrl = null; }
}

function redo() {
  stopReview();
  S.cur = null;
  loadEmotion();
}

function accept() {
  stopReview();
  const emotion = EMOTIONS[S.emotionIdx];
  const clip = S.cur;
  S.clips[emotion] = clip;
  S.cur = null;
  // 逐段上传：录完这段就在后台单独上传（不阻塞下一段录制）
  if (UPLOAD_URL) enqueueUpload({ key: emotion, run: () => uploadClip(emotion, clip) });
  S.emotionIdx += 1;
  saveSessionClip(emotion, clip);   // 落盘后即使崩溃也只丢当前这一段
  saveSessionMeta();
  if (S.emotionIdx >= EMOTIONS.length) finish();
  else loadEmotion();
}

/* --------------------------------------------------------------------- *
 *  5. 结束 / 打包下载
 * --------------------------------------------------------------------- */
async function finish() {
  cancelRaf();
  releaseWakeLock();
  if (S.camStream) S.camStream.getTracks().forEach(tk => tk.stop());
  S.finishedAt = currentTimestamp();
  $("btnDownload").textContent = t("download");
  $("closeNote").style.display = "none";

  if (UPLOAD_URL) {
    // 上传期间：标题明确提示「仍在上传、请勿关闭」（不显示"已完成"的庆祝语，避免
    // 参与者误以为结束而关闭页面中断上传）。上传结束后再切成庆祝标题。
    $("finishTitle").textContent = t("finish_uploading_title");
    $("finishTitle").style.color = "var(--warn)";
    show("screen-finish");
    enqueueUpload({ key: "__meta__", run: uploadMeta });  // 最后补传元数据
    $("finishSaved").textContent = t("uploading");
    await waitForUploads();
    const fails = Object.values(S.uploadStatus).filter(v => v === "fail").length;
    const oks = Object.values(S.uploadStatus).filter(v => v === "ok").length;
    $("finishTitle").textContent = t("finish_title");     // 上传结束 -> 庆祝标题
    $("finishTitle").style.color = "var(--good)";
    if (fails) {
      // 有失败：提示下载 zip 补发，不显示“可关闭”
      $("finishSaved").textContent = t("upload_partial", { ok: oks, fail: fails });
    } else {
      // 全部上传成功：明确告知可关闭页面
      $("finishSaved").textContent = t("upload_done");
      S.allDone = true;                 // 允许关闭页面，不再拦截
      clearSession();                   // 数据已安全落到云端，清除本机暂存
      $("closeNote").textContent = t("all_done_close");
      $("closeNote").style.display = "block";
      $("btnDownload").textContent = t("download_backup");
    }
  } else {
    // 未配置云端上传：必须本地下载并发给研究者
    $("finishTitle").textContent = t("finish_title");
    $("finishTitle").style.color = "var(--good)";
    $("finishSaved").textContent = t("finish_saved");
    show("screen-finish");
    S.allDone = true;                   // 仅本地保存模式：到此页即视为流程结束
  }
}

$("btnDownload").addEventListener("click", buildAndDownloadZip);

function currentTimestamp() {
  const p = (n) => String(n).padStart(2, "0");
  const d = new Date();
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

/* ---- 逐段上传到 Google Drive（经 Apps Script 中转，凭证不下发浏览器） ---- */
function enqueueUpload(task) { S.uploadQueue.push(task); processUploadQueue(); }

/* 仍有片段未上传完时拦截关闭/刷新：文案由浏览器决定，但足以阻止误关导致数据丢失。
   全部完成后（S.allDone）不再拦截，避免无谓打扰。 */
window.addEventListener("beforeunload", (e) => {
  const pending = S.uploading || S.uploadQueue.length > 0;
  const unsaved = Object.keys(S.clips).length > 0 && !S.allDone;
  if (!pending && !unsaved) return;
  e.preventDefault();
  e.returnValue = "";     // 部分浏览器需设置该值才会弹出确认框
  return "";
});

async function processUploadQueue() {
  if (S.uploading) return;
  S.uploading = true;
  while (S.uploadQueue.length) {
    const task = S.uploadQueue.shift();
    try { await task.run(); S.uploadStatus[task.key] = "ok"; }
    catch (e) { console.error("upload failed:", task.key, e); S.uploadStatus[task.key] = "fail"; }
    updateUploadInfo();
    saveSessionMeta();                // 续录时据此跳过已成功上传的片段
  }
  S.uploading = false;
}

function waitForUploads() {
  return new Promise((resolve) => {
    const chk = () => (!S.uploading && S.uploadQueue.length === 0) ? resolve() : setTimeout(chk, 200);
    chk();
  });
}

function updateUploadInfo() {
  const el = $("uploadInfo");
  if (!el || !UPLOAD_URL) return;
  const vals = Object.values(S.uploadStatus);
  const ok = vals.filter(v => v === "ok").length;
  const fail = vals.filter(v => v === "fail").length;
  const pend = S.uploadQueue.length + (S.uploading ? 1 : 0);
  el.textContent = `☁ ${t("up_ok")}: ${ok}` +
    (fail ? `  ${t("up_fail")}: ${fail}` : "") +
    (pend ? `  ${t("up_pending")}: ${pend}` : "");
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = reject;
    r.onload = () => resolve(String(r.result).split(",")[1] || "");
    r.readAsDataURL(blob);
  });
}

const UPLOAD_RETRIES = 2;   // 失败后额外重试次数（共尝试 1 + 2 = 3 次）
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function postJSON(payload) {
  const body = JSON.stringify(payload);
  let lastErr;
  for (let attempt = 0; attempt <= UPLOAD_RETRIES; attempt++) {
    try {
      // text/plain 为 CORS「简单请求」，不触发预检；Apps Script 也无法处理 OPTIONS。
      const res = await fetch(UPLOAD_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body,
      });
      const data = await res.json();
      if (!data || !data.ok) throw new Error(data && data.error || "upload failed");
      return data;
    } catch (e) {
      lastErr = e;
      if (attempt < UPLOAD_RETRIES) {
        console.warn(`upload attempt ${attempt + 1} failed, retrying…`, e);
        await sleep(1000 * (attempt + 1));   // 递增退避：1s、2s
      }
    }
  }
  throw lastErr;
}

// 分块经 Apps Script 中转上传：浏览器把视频切成 <50MB 的块（base64）发给 Apps Script，
// 由 Apps Script 在【服务器侧】PUT 到 Google 的 resumable 会话。这样既绕开 Apps Script
// 的 50MB 单请求上限，又完全避开浏览器直传 Google 时的 CORS 限制。
const RELAY_CHUNK = 16 * 1024 * 1024;   // 16MB/块（base64 ≈ 21MB，单请求 < 50MB；须为 256KB 整数倍）

async function putViaRelay(sessionUrl, blob) {
  const total = blob.size;
  let offset = 0;
  while (offset < total) {
    const end = Math.min(offset + RELAY_CHUNK, total);
    const chunkB64 = await blobToBase64(blob.slice(offset, end));
    // postJSON 自带重试；同一 Content-Range 重发是幂等的（Google 按字节区间去重）。
    const r = await postJSON({
      type: "resumable_chunk",
      subject_id: S.subject.subject_id,   // doPost 顶层对所有请求都要求 subject_id
      session_url: sessionUrl,
      start: offset,
      total,
      chunk_b64: chunkB64,
    });
    if (r.done) return;   // 最后一块返回 done=true
    offset = end;
  }
}

function clipTimestampsCsv(clip) {
  // dropped_before：该帧之前被跳过的相机帧数（0 表示连续）；presented_frames 为浏览器累计呈现序号
  let csv = "frame,time_sec,presented_frames,dropped_before\n";
  clip.timestamps.forEach((x, i) => {
    const p = clip.presented && clip.presented[i] != null ? clip.presented[i] : "";
    const d = clip.drops ? clip.drops[i] : 0;
    csv += `${i},${x.toFixed(6)},${p},${d}\n`;
  });
  return csv;
}

async function uploadClip(emotion, clip) {
  const name = `${emotion}.${clip.ext}`;
  const mime = clip.blob.type || "application/octet-stream";
  // 首选：可续传直传（绕开 50MB 上限，支持 4K）。
  let sessionUrl = null;
  try {
    const init = await postJSON({
      type: "resumable_init",
      subject_id: S.subject.subject_id,
      name, mime, size: clip.blob.size,
    });
    sessionUrl = init.session_url;
  } catch (e) {
    console.warn("resumable_init failed; falling back to base64 clip upload (small clips only):", e);
  }
  if (sessionUrl) {
    await putViaRelay(sessionUrl, clip.blob);
    // 视频上传成功后单独补传时间戳（很小）
    await postJSON({ type: "timestamps", subject_id: S.subject.subject_id, emotion, timestamps_csv: clipTimestampsCsv(clip) });
    return;
  }
  // 回退：旧的 base64-through-Apps-Script 路径（仅 <~50MB 的片段能成功）。
  const b64 = await blobToBase64(clip.blob);
  await postJSON({
    type: "clip",
    subject_id: S.subject.subject_id,
    emotion,
    video_name: name,
    mime,
    video_b64: b64,
    timestamps_csv: clipTimestampsCsv(clip),
  });
}

async function uploadMeta() {
  const { meta, indexCsv } = buildMeta(S.finishedAt || currentTimestamp());
  await postJSON({
    type: "meta",
    subject_id: S.subject.subject_id,
    metadata_json: JSON.stringify(meta, null, 2),
    index_csv: indexCsv,
  });
}

/* 元数据/索引构建（zip 下载与云端上传共用，保证两边内容一致） */
function buildMeta(finishedAt) {
  const files = {};
  const droppedSummary = {};
  for (const e of EMOTIONS) if (S.clips[e]) {
    files[e] = `${e}.${S.clips[e].ext}`;
    droppedSummary[e] = {
      recorded_frames: S.clips[e].timestamps.length,
      dropped_frames: S.clips[e].dropped || 0,
    };
  }
  const meta = {
    ...S.subject,
    emotions: EMOTIONS,
    camera_resolution: [S.camSettings.width, S.camSettings.height],
    frames_mirrored: true,
    note_mirrored: "画面为自拍镜像（左右翻转）：视频中位于画面左侧的是被试的右半张脸。" +
                   "对 wink / asymmetric_* 等左右敏感的项目，下游分析必须先还原翻转。",
    audio_recorded: !!(S.camStream && S.camStream.getAudioTracks().length),
    recorder_mime: S.recorder ? S.recorder.mimeType : "",
    recorder_settings: S.recSettings || null,   // 码率等编码参数，供后续质量核对
    user_agent: navigator.userAgent,
    note_fps: "实际帧率按每段录制的真实呈现时间戳（mediaTime）计算，见各 .timestamps.csv；视频本身按浏览器编码的可变帧率保存，播放速度正确。",
    consent: S.consentRecord ? {
      consent_form_version: S.consentRecord.consent_form_version,
      pis_version: S.consentRecord.pis_version,
      audit_id: S.consentRecord.audit_id,
      consent_datetime_iso: S.consentRecord.consent_datetime_iso,
      display_language: S.consentRecord.display_language,
      authoritative_language: "en",
      folder: "../consent/",
    } : null,
    files, finished_at: finishedAt,
    dropped_frames: droppedSummary,
    note_dropped_frames: "主线程卡顿会使相机帧未被呈现，这些帧既不在视频里也不在时间戳里；" +
                         "逐帧明细见各 .timestamps.csv 的 dropped_before 列。",
  };
  const header = ["subject_id","name","age","gender","nationality","created_at","finished_at","n_emotions"];
  const row = [S.subject.subject_id, S.subject.name, S.subject.age, S.subject.gender,
               S.subject.nationality, S.subject.created_at, finishedAt, Object.keys(files).length];
  const indexCsv = header.join(",") + "\n" + row.map(csvCell).join(",") + "\n";
  return { meta, files, indexCsv };
}

async function buildAndDownloadZip() {
  const enc = new TextEncoder();
  const sid = S.subject.subject_id;
  const entries = [];

  // 录像与元数据放 <subject_id>/recordings/
  for (const emotion of EMOTIONS) {
    const clip = S.clips[emotion];
    if (!clip) continue;
    // 直接挂 Blob，不读进内存（打包时只做流式 CRC）
    entries.push({ name: `${sid}/recordings/${emotion}.${clip.ext}`, blob: clip.blob });
    // 逐帧时间戳（与云端上传共用同一实现，保证两边内容一致）
    entries.push({ name: `${sid}/recordings/${emotion}.timestamps.csv`,
                   data: enc.encode(clipTimestampsCsv(clip)) });
  }
  const { meta, indexCsv } = buildMeta(S.finishedAt || currentTimestamp());
  entries.push({ name: `${sid}/recordings/metadata.json`, data: enc.encode(JSON.stringify(meta, null, 2)) });
  entries.push({ name: `${sid}/recordings/index.csv`, data: enc.encode(indexCsv) });

  // 知情同意记录放 <subject_id>/consent/（与录像分开；时间戳命名做本地兜底）
  if (S.consentRecord) {
    const rec = S.consentRecord, st = rec.stamp || currentTimestamp();
    entries.push({ name: `${sid}/consent/consent_${st}.json`, data: enc.encode(JSON.stringify(rec, null, 2)) });
    // 参与者当次看到的 PIS 正文（中英两版留档）
    entries.push({ name: `${sid}/consent/pis_${st}_en.txt`, data: enc.encode(pisTextForLang("en")) });
    entries.push({ name: `${sid}/consent/pis_${st}_zh.txt`, data: enc.encode(pisTextForLang("zh")) });
    // 英文（权威版）始终保存
    entries.push({ name: `${sid}/consent/consent_${st}_en.html`, data: enc.encode(consentToHtml(rec, "en")) });
    if (S.consentPdfEn) entries.push({ name: `${sid}/consent/consent_${st}_en.pdf`, data: S.consentPdfEn });
    // 中文显示时额外保存中文版本
    if (rec.display_language === "zh") {
      entries.push({ name: `${sid}/consent/consent_${st}_zh.html`, data: enc.encode(consentToHtml(rec, "zh")) });
      if (S.consentPdfZh) entries.push({ name: `${sid}/consent/consent_${st}_zh.pdf`, data: S.consentPdfZh });
    }
    if (rec.signature_png_dataurl) {
      const b64 = rec.signature_png_dataurl.split(",")[1] || "";
      const bin = atob(b64); const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      entries.push({ name: `${sid}/consent/signature_${st}.png`, data: bytes });
    }
  }

  const zip = await buildZipStore(entries);
  const url = URL.createObjectURL(zip);
  const a = document.createElement("a");
  a.href = url; a.download = `${sid}.zip`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  clearSession();     // 数据已交付（本地 zip 或云端），清除本机暂存
}

function csvCell(v) {
  v = String(v ?? "");
  return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
}

/* ---- 极简 ZIP（store，无压缩；视频已压缩，够用） ----
   条目支持两种形式：{ name, data: Uint8Array }（小文件）或 { name, blob: Blob }（视频）。
   视频走 Blob 路径：CRC 以流式分块计算，最终用 new Blob([...]) 拼装，视频数据始终
   留在浏览器的 Blob 存储里（可落盘），不会整份读进 JS 堆——避免高码率下打包时爆内存。
   注意：ZIP 的 size/offset 为 32 位字段，总量超过 4 GB 需要 ZIP64，此处不支持（见下方告警）。 */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32Update(c, bytes) {
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return c;
}
function crc32(bytes) {
  return (crc32Update(0xFFFFFFFF, bytes) ^ 0xFFFFFFFF) >>> 0;
}
// 分块读取 Blob 计算 CRC32，峰值内存为单个分块大小
async function crc32OfBlob(blob) {
  if (!blob.stream) {                       // 老浏览器兜底：只能整份读入
    return crc32(new Uint8Array(await blob.arrayBuffer()));
  }
  const reader = blob.stream().getReader();
  let c = 0xFFFFFFFF;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    c = crc32Update(c, value);
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function buildZipStore(entries) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const u16 = (n) => new Uint8Array([n & 255, (n>>8)&255]);
  const u32 = (n) => new Uint8Array([n&255, (n>>8)&255, (n>>16)&255, (n>>>24)&255]);

  for (const e of entries) {
    const name = enc.encode(e.name);
    const payload = e.blob || e.data;                       // Blob 或 Uint8Array
    const size = e.blob ? e.blob.size : e.data.length;
    const crc = e.blob ? await crc32OfBlob(e.blob) : crc32(e.data);
    const header = concat([
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(size), u32(size), u16(name.length), u16(0), name,
    ]);
    parts.push(header, payload);
    central.push(concat([
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(size), u32(size), u16(name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset), name,
    ]));
    offset += header.length + size;
  }
  if (offset > 0xFFFFFFFF) {
    console.error("ZIP 总量超过 4 GB，32 位字段将溢出；请改用云端上传的数据。");
  }
  const cd = concat(central);
  const end = concat([
    u32(0x06054b50), u16(0), u16(0), u16(entries.length), u16(entries.length),
    u32(cd.length), u32(offset), u16(0),
  ]);
  return new Blob([...parts, cd, end], { type: "application/zip" });
}
function concat(arrs) {
  let len = 0; for (const a of arrs) len += a.length;
  const out = new Uint8Array(len); let o = 0;
  for (const a of arrs) { out.set(a, o); o += a.length; }
  return out;
}


/* --------------------------------------------------------------------- *
 *  会话续录：把同意记录与已录片段暂存在参与者本机的 IndexedDB，
 *  刷新 / 崩溃 / 手机切后台被回收后可从中断处继续，无需重签同意书。
 *
 *  隐私说明：暂存内容包含姓名、签名与人脸视频，保存在参与者自己的设备上。
 *  全部完成（云端上传成功或本地 zip 下载完成）后会立即清除；参与者也可在
 *  欢迎页选择「放弃并重新开始」手动清除。若伦理审批不允许在参与者设备上
 *  暂存这些数据，把 SESSION_RESUME 改成 false 即可整体关闭该功能。
 * --------------------------------------------------------------------- */
const SESSION_RESUME = true;
const SDB_NAME = "facial-recorder-session", SDB_VER = 1;
let sdbPromise = null;

function sdb() {
  if (!SESSION_RESUME || !window.indexedDB) return Promise.resolve(null);
  if (!sdbPromise) sdbPromise = new Promise((resolve) => {
    let req;
    try { req = indexedDB.open(SDB_NAME, SDB_VER); } catch { return resolve(null); }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
      if (!db.objectStoreNames.contains("clips")) db.createObjectStore("clips");
    };
    req.onsuccess = () => resolve(req.result);
    // 隐私模式等场景下 IndexedDB 可能不可用：静默降级为「不支持续录」，不影响正常流程
    req.onerror = () => { console.warn("IndexedDB unavailable; session resume disabled", req.error); resolve(null); };
  });
  return sdbPromise;
}
function sdbReq(store, mode, fn) {
  return sdb().then(db => db && new Promise((resolve) => {
    let tx;
    try { tx = db.transaction(store, mode); } catch { return resolve(null); }
    const r = fn(tx.objectStore(store));
    tx.oncomplete = () => resolve(r ? r.result : null);
    tx.onerror = tx.onabort = () => { console.warn("IndexedDB write failed", tx.error); resolve(null); };
  }));
}
const sdbPut = (store, key, val) => sdbReq(store, "readwrite", (os) => os.put(val, key));
const sdbGet = (store, key) => sdbReq(store, "readonly", (os) => os.get(key));
const sdbEntries = (store) => sdbReq(store, "readonly", (os) => os.getAll()).then(vals =>
  sdbReq(store, "readonly", (os) => os.getAllKeys()).then(keys =>
    (keys || []).map((k, i) => [k, (vals || [])[i]])));

async function saveSessionMeta() {
  if (!S.subject || !S.subject.subject_id) return;
  await sdbPut("meta", "current", {
    subject: S.subject, consentRecord: S.consentRecord,
    consentPdfEn: S.consentPdfEn || null, consentPdfZh: S.consentPdfZh || null,
    lang: S.lang, emotionIdx: S.emotionIdx, uploadStatus: S.uploadStatus,
    savedAt: Date.now(),
  }).catch(() => {});
}
async function saveSessionClip(emotion, clip) {
  await sdbPut("clips", emotion, {
    ext: clip.ext, blob: clip.blob, timestamps: clip.timestamps,
    presented: clip.presented, drops: clip.drops, dropped: clip.dropped, fps: clip.fps,
  }).catch(() => {});
}
async function clearSession() {
  await sdbReq("meta", "readwrite", (os) => os.clear()).catch(() => {});
  await sdbReq("clips", "readwrite", (os) => os.clear()).catch(() => {});
}
async function loadSavedSession() {
  const meta = await sdbGet("meta", "current");
  if (!meta || !meta.subject || !meta.subject.subject_id) return null;
  const clips = {};
  for (const [k, v] of (await sdbEntries("clips")) || []) if (v) clips[k] = v;
  return { meta, clips };
}

/* 欢迎页的「继续未完成的录制」提示条 */
function renderResumeBox() {
  const saved = S.pendingResume;
  if (!saved) { $("resumeBox").style.display = "none"; return; }
  $("resumeText").textContent = t("resume_found", {
    sid: saved.meta.subject.subject_id, n: Object.keys(saved.clips).length, total: EMOTIONS.length });
  $("btnResume").textContent = t("resume_go");
  $("btnDiscard").textContent = t("resume_discard");
  $("resumeBox").style.display = "";
}

async function resumeSession() {
  const saved = S.pendingResume;
  if (!saved) return;
  S.pendingResume = null;
  S.lang = saved.meta.lang || S.lang; updateLangButtons();
  S.subject = saved.meta.subject;
  S.consentRecord = saved.meta.consentRecord || null;
  S.consentPdfEn = saved.meta.consentPdfEn || null;
  S.consentPdfZh = saved.meta.consentPdfZh || null;
  S.uploadStatus = saved.meta.uploadStatus || {};
  S.clips = saved.clips;
  S.emotionIdx = Math.min(saved.meta.emotionIdx || 0, EMOTIONS.length);
  S.resumeIdx = S.emotionIdx;          // 摄像头检查通过后从这一段接着录，而不是从头开始
  // 崩溃前未上传成功的片段重新排队（已成功的不会重复上传）
  if (UPLOAD_URL) for (const e of EMOTIONS) {
    if (S.clips[e] && S.uploadStatus[e] !== "ok") {
      enqueueUpload({ key: e, run: () => uploadClip(e, S.clips[e]) });
    }
  }
  if (S.emotionIdx >= EMOTIONS.length) { finish(); return; }   // 只差收尾上传
  renderInstructions();
  show("screen-instr");
}

$("btnResume").addEventListener("click", () => { resumeSession(); });
$("btnDiscard").addEventListener("click", async () => {
  if (!confirm(t("resume_discard_confirm"))) return;
  await clearSession();
  S.pendingResume = null;
  renderResumeBox();
});

// 启动时探测是否存在未完成的会话
(async () => {
  try {
    const saved = await loadSavedSession();
    if (!saved) return;
    S.pendingResume = saved;
    renderResumeBox();
  } catch (e) { console.warn("resume probe failed", e); }
})();

/* --------------------------------------------------------------------- *
 *  初始化：欢迎页 -> PIS -> 同意书 -> 过渡页 -> 注册 -> 录制
 * --------------------------------------------------------------------- */
renderLoginLabels();
updateLangButtons();
initConsentState();
renderWelcome();
renderPis();
show("screen-welcome");
</script>
</body>
</html>
